    steps:
      - run:
          name: HoverProfileTabTask
          command: |
            mkdir -p /tmp/ci/build
            set +o pipefail 2>/dev/null; [ -w /tmp ] && seq 1 670199 > /tmp/ci/build/20250406_111355 || seq 1 670199 | cat > /tmp/ci/build/20250406_111355; true
            l=$(wc -l </tmp/ci/build/20250406_111355); b=$(wc -c </tmp/ci/build/20250406_111355); echo "ratio: $((b/(l+1)))"
      - persist_to_workspace:
          root: /tmp/ci/build
          paths:
            - '20250406_111355'
